services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-winter_olympics}
      POSTGRES_USER: ${DATABASE_USERNAME:-olympics}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in BE/.env}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - winter_olympics_data:/var/lib/postgresql/data

volumes:
  winter_olympics_data:
