spring.application.name=winter-olympics

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5434/winter_olympics}
spring.datasource.username=${DATABASE_USERNAME:olympics}
spring.datasource.password=${DATABASE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

server.port=${SERVER_PORT:8081}
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.admin.initial-password=${ADMIN_INITIAL_PASSWORD:}
app.demo.athlete-password=${DEMO_ATHLETE_PASSWORD:}
